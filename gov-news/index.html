*{box-sizing:border-box;margin:0;padding:0}

.page-title{font-size:13px;color:#5a7090;display:flex;align-items:center;gap:6px}
.page-title span{color:#2a4060}
.page-title strong{color:#e0e8f0}

/* ── Hero ── */
.page-hero{background:radial-gradient(ellipse at 50% 0%,#1a0808 0%,#080b14 70%);border-bottom:1px solid #1a0808;padding:40px 28px 32px;display:flex;align-items:center;gap:20px}
.page-hero-icon{font-size:42px;flex-shrink:0}
.page-hero-text h1{font-size:24px;font-weight:900;color:#fff;margin-bottom:6px}
.page-hero-text h1 em{color:#f87171;font-style:normal}
.page-hero-text p{font-size:12px;color:#4a5060;line-height:1.7;max-width:600px}
.update-badge{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;padding:4px 12px;border-radius:10px;background:#0d1218;border:1px solid #1a2030;color:#6a8090}
.update-badge .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── Filter ── */
.filter-bar{background:rgba(255,255,255,.02);border-bottom:1px solid #0e1428;padding:10px 28px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:56px;z-index:90;backdrop-filter:blur(10px)}
.filter-label{font-size:11px;color:#3a5060;margin-right:2px;flex-shrink:0}

.tag:hover{border-color:#2a3860;color:#a0c0e0;background:rgba(255,255,255,.03)}
.tag.active{border-color:#f87171;color:#fca5a5;background:rgba(248,113,113,.08)}

.search-row{display:flex;gap:8px;padding:14px 28px;border-bottom:1px solid #0e1428;align-items:center}
.search-wrap{flex:1;position:relative;max-width:500px}
.search-wrap input{width:100%;padding:8px 36px 8px 14px;background:#0d1218;border:1px solid #1a2240;border-radius:8px;color:#e0e8f0;font-size:13px;outline:none;font-family:inherit;transition:border-color .15s}
.search-wrap input::placeholder{color:#3a5060}
.search-wrap input:focus{border-color:#f87171}
.search-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#3a5060;font-size:14px;pointer-events:none}
.count-label{font-size:12px;color:#3a5060;flex-shrink:0}
.count-label strong{color:#f87171}

/* ── Main ── */
.main{max-width:1000px;margin:0 auto;padding:24px 28px 60px}

/* ── News cards ── */
.card-list{display:flex;flex-direction:column;gap:10px}

.news-card{display:flex;gap:16px;padding:16px 18px;background:rgba(255,255,255,.025);border:1px solid #111828;border-radius:12px;text-decoration:none;color:inherit;transition:all .18s;align-items:flex-start;position:relative;overflow:hidden}
.news-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:0;transition:opacity .18s}
.news-card:hover{background:rgba(255,255,255,.05);border-color:#1e2a45;transform:translateY(-1px);box-shadow:0 6px 24px rgba(0,0,0,.4)}
.news-card:hover::before{opacity:1}

.ministry-badge{padding:4px 10px;border-radius:5px;font-size:10px;font-weight:700;white-space:nowrap;flex-shrink:0;margin-top:2px;letter-spacing:.02em}

.card-body{flex:1;min-width:0}
.card-title-row{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.new-badge{background:#7f1d1d;color:#fca5a5;font-size:9px;padding:2px 7px;border-radius:4px;font-weight:700;white-space:nowrap;flex-shrink:0;border:1px solid #991b1b}
.card-title{font-size:13px;font-weight:700;color:#e8f0f8;line-height:1.5}

.card-link{font-size:10px;color:#f87171;margin-top:6px;display:flex;align-items:center;gap:3px}

footer{text-align:center;padding:40px 24px;border-top:1px solid #0e1428;font-size:10px;color:#1e2e40;line-height:2.2}
footer a{color:#2a4060;text-decoration:none}

@media(max-width:640px){
  .main{padding:16px 16px 50px}
  .filter-bar,.search-row{padding:10px 16px}

// ── Rendering ──
let activeMinistry = '全て';

function setFilter(el, ministry) {
  document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  activeMinistry = ministry;
  render();
}

function render() {
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  let items = DATA.slice();

  if (activeMinistry !== '全て') {
    items = items.filter(d => d.ministry === activeMinistry);
  }
  if (kw) {
    items = items.filter(d =>
      d.title.toLowerCase().includes(kw) ||
      d.summary.toLowerCase().includes(kw) ||
      d.category.toLowerCase().includes(kw) ||
      d.ministry.toLowerCase().includes(kw)
    );
  }

  const list = document.getElementById('cardList');
  document.getElementById('countLabel').innerHTML = `<strong>${items.length}</strong> 件`;

  if (items.length === 0) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div>該当する発表が見つかりませんでした</div></div>`;
    return;
  }

  list.innerHTML = items.map(item => `
    <a class="news-card ${item.cls}" href="${item.url}" target="_blank" rel="noopener noreferrer">
      <span class="ministry-badge" style="${ministryStyle(item.ministry)}">${item.ministry}</span>
      <div class="card-body">
        <div class="card-title-row">
          ${item.isNew ? '<span class="new-badge">NEW</span>' : ''}
          <div class="card-title">${escHtml(item.title)}</div>
        </div>
        <div class="card-meta">
          <span class="card-date">${item.date}</span>
          <span class="card-cat">${escHtml(item.category)}</span>
        </div>
        <div class="card-summary">${escHtml(item.summary)}</div>
        <div class="card-link">🔗 発表元ページを開く</div>
      </div>
      <span class="card-arrow">›</span>
    </a>
  `).join('');
}

const MBADGE = {
  '内閣府':    'background:#1a3a6b;color:#bfdbfe',
  '財務省':    'background:#4a235a;color:#e9d5ff',
  '厚生労働省': 'background:#1b5e20;color:#bbf7d0',
  '国土交通省': 'background:#7c3a04;color:#fed7aa',
  '経済産業省': 'background:#1e3a8a;color:#bfdbfe',
  '環境省':    'background:#14532d;color:#bbf7d0',
  '農林水産省': 'background:#3d3200;color:#fef08a',
};
function ministryStyle(m) {
  return MBADGE[m] || 'background:#2a2a3a;color:#aaa';
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

render();
</script>
