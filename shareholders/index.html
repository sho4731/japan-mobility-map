function shSize(id){const t=LINKS_RAW.filter(l=>l[0]===id).reduce((a,l)=>a+l[2],0);return Math.min(46,Math.max(12,Math.sqrt(t)*3.2));}
const nodes=[
  ...SHAREHOLDERS.map(s=>({...s,isCompany:false,size:shSize(s.id),holdCount:LINKS_RAW.filter(l=>l[0]===s.id).length})),
  ...COMPANIES.map(c=>({...c,isCompany:true,type:"company",size:24})),

const links=LINKS_RAW.map(([s,t,v])=>({source:s,target:t,value:v}));
let activeSector="all",minPct=0,searchQ="",activeTab="ranking";
function matchSector(s){if(activeSector==="all")return true;if(activeSector==="その他")return!["自動車","自動車部品","電機・IT","精密機器","半導体","化学","金融","通信・投資","ゲーム","小売","製薬","商社","素材"].includes(s);return s===activeSector;}
function buildRanking(){
  const el=document.getElementById("ranking-panel");el.innerHTML="";
  const maxV=Math.max(...LINKS_RAW.map(l=>l[2]));
  const filtered=SHAREHOLDERS
    .map(sh=>({sh,links:LINKS_RAW.filter(l=>l[0]===sh.id&&l[2]>=minPct&&(activeSector==="all"||COMPANIES.find(c=>c.id===l[1]&&matchSector(c.sector))))}))
    .filter(x=>x.links.length>0)
    .sort((a,b)=>b.links.length-a.links.length||b.links.reduce((s,l)=>s+l[2],0)-a.links.reduce((s,l)=>s+l[2],0));
  filtered.forEach(({sh,links:hlds})=>{
    const card=document.createElement("div");card.className="sh-card";card.dataset.id=sh.id;
    const total=hlds.reduce((s,l)=>s+l[2],0).toFixed(1);
    const color=TC[sh.type]||"#888";
    const barsHtml=hlds.sort((a,b)=>b[2]-a[2]).slice(0,4).map(l=>{
      const co=COMPANIES.find(c=>c.id===l[1]);const c2=co?SC[co.sector]||"#60a5fa":"#60a5fa";
      return`<div class="sh-bar-row"><div class="sh-bar-lbl" title="${l[1].replace('\n',' ')}">${l[1].replace('\n',' ')}</div><div class="sh-bar-track"><div class="sh-bar-fill" style="width:${Math.min(100,l[2]/maxV*100).toFixed(1)}%;background:${c2}"></div></div><div class="sh-bar-pct">${l[2]}%</div></div>`;
    }).join('');
    const typeLbl={trust:"信託・機関",gov:"政府系",corporate:"事業会社",individual:"個人",foreign:"外国機関",institution:"保険・機関"}[sh.type]||"";
    card.innerHTML=`<div class="sh-name"><div class="sh-dot" style="background:${color}"></div>${sh.id.replace('\n',' ')}</div><div class="sh-meta">${typeLbl} / ${hlds.length}社 / 合計${total}%</div><div class="sh-bars">${barsHtml}</div>`;
    card.addEventListener("click",()=>highlightNode(sh.id,card));
    el.appendChild(card);
  });
}
function showCross(nodeId){

  document.getElementById("ranking-panel").style.display="none";
  const cp=document.getElementById("cross-panel");cp.style.display="block";
  const sh=SHAREHOLDERS.find(s=>s.id===nodeId);
  const co=COMPANIES.find(c=>c.id===nodeId);
  cp.innerHTML="";
  if(sh){
    const hlds=LINKS_RAW.filter(l=>l[0]===nodeId).sort((a,b)=>b[2]-a[2]);
    cp.innerHTML=`<div class="cross-title">${nodeId.replace('\n',' ')}</div><div class="cross-sub">${{trust:"信託・機関投資家",gov:"政府系株主",corporate:"事業会社株主",individual:"個人（創業家）",foreign:"外国機関投資家",institution:"保険会社"}[sh.type]||""} / ${hlds.length}社保有</div>${hlds.map(l=>`<div class="cross-row"><span class="cross-name">${l[1].replace('\n',' ')}</span><span class="cross-val">${l[2]}%</span></div>`).join('')}`;
  }else if(co){
    const inv=LINKS_RAW.filter(l=>l[1]===nodeId).sort((a,b)=>b[2]-a[2]);
    cp.innerHTML=`<div class="cross-title">${nodeId.replace('\n',' ')}</div><div class="cross-sub">${co.sector} / ${co.code} / 株主${inv.length}社</div>${inv.map(l=>`<div class="cross-row"><span class="cross-name">${l[0].replace('\n',' ')}</span><span class="cross-val">${l[2]}%</span></div>`).join('')}`;
  }
}

[["arr-hi","#3b82f6",26],["arr-lo","#2a3550",26],["arr-gov","#fb923c",28],["arr-grn","#34d399",26],["arr-ind","#f59e0b",26],["arr-roc","#6366f1",30]].forEach(([id,c,r])=>{

  .force("link",d3.forceLink(links).id(d=>d.id).distance(d=>{if(d.value>=40)return 90;if(d.value>=15)return 140;if(d.value>=8)return 170;return 210;}).strength(d=>d.value>15?0.9:d.value>5?0.6:0.3))

  .attr("stroke-width",d=>Math.max(0.5,Math.sqrt(d.value)*0.8))

  .attr("marker-end",d=>{const sh=SHAREHOLDERS.find(s=>s.id===(d.source.id||d.source));if(!sh)return"url(#arr-lo)";if(sh.type==="gov")return"url(#arr-gov)";if(sh.type==="individual")return"url(#arr-grn)";if(sh.id==="バークシャー・ハサウェイ")return"url(#arr-ind)";if(sh.id==="ロシュ")return"url(#arr-roc)";return d.value>=10?"url(#arr-hi)":"url(#arr-lo)";});
const llblSel=g.append("g").selectAll("text").data(links.filter(l=>l.value>=10)).join("text")
  .attr("text-anchor","middle").attr("font-size",7.5).attr("fill","#3a5070").text(d=>d.value+"%");
const nodeSel=g.append("g").selectAll("g").data(nodes).join("g")
  .attr("class",d=>"node"+(d.isCompany?" company":""))
  .style("--glow",d=>d.isCompany?(SC[d.sector]||"#f87171"):(TC[d.type]||"#60a5fa"))
  .call(d3.drag()
    .on("start",(e,d)=>{if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y})
    .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y})
    .on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
nodeSel.append("circle")
  .attr("r",d=>d.size)
  .attr("fill",d=>{const c=d.isCompany?(SC[d.sector]||"#f87171"):(TC[d.type]||"#888");return c+(d.isCompany?"18":"15");})
  .attr("stroke",d=>d.isCompany?(SC[d.sector]||"#f87171"):(TC[d.type]||"#888"))
  .attr("stroke-width",d=>d.isCompany?2:1.5);
nodeSel.each(function(d){
  const el=d3.select(this);const lines=d.id.split("\n");const lh=11,totalH=(lines.length-1)*lh;
  lines.forEach((line,i)=>el.append("text").attr("y",-totalH/2+i*lh).text(line));

const tt=document.getElementById("tt");
nodeSel

    const name=(d.id||"").replace(/\n/g," ");let html=`<div class="tt-title">${name}</div>`;

    }else{
      const typeLbl={trust:"信託・機関投資家",gov:"政府系株主",corporate:"事業会社株主",individual:"個人（創業家）",foreign:"外国機関投資家",institution:"保険会社・機関"}[d.type]||"";
      html+=`<div class="tt-type" style="color:${TC[d.type]}">${typeLbl}</div>`;

function highlightNode(id,cardEl){
  const connected=new Set([id]);
  links.forEach(l=>{const s=l.source.id||l.source,t=l.target.id||l.target;if(s===id)connected.add(t);if(t===id)connected.add(s);});
  nodeSel.classed("highlighted",d=>connected.has(d.id)).classed("faded",d=>!connected.has(d.id));
  linkSel.classed("faded",l=>!connected.has(l.source.id||l.source)||!connected.has(l.target.id||l.target));
  document.querySelectorAll(".sh-card").forEach(c=>c.classList.remove("sel"));
  if(cardEl)cardEl.classList.add("sel");
  else document.querySelectorAll(".sh-card").forEach(c=>{if(c.dataset.id===id)c.classList.add("sel");});
}
function resetHighlight(){
  nodeSel.classed("highlighted faded",false);linkSel.classed("faded",false);
  document.querySelectorAll(".sh-card").forEach(c=>c.classList.remove("sel"));
}
sim.on("tick",()=>{
  linkSel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  llblSel.attr("x",d=>(d.source.x+d.target.x)/2).attr("y",d=>(d.source.y+d.target.y)/2-3);
  nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
});
function applyFilters(){
  const q=searchQ.toLowerCase();
  nodeSel.style("display",d=>{
    if(q&&!d.id.toLowerCase().replace(/\n/g,"").includes(q))return"none";
    if(!d.isCompany)return null;
    if(activeSector!=="all"&&!matchSector(d.sector))return"none";
    return null;
  });
  linkSel.style("display",l=>{
    const s=l.source.id||l.source,t=l.target.id||l.target;
    if(l.value<minPct)return"none";
    const co=COMPANIES.find(c=>c.id===t);
    if(activeSector!=="all"&&co&&!matchSector(co.sector))return"none";
    if(q&&!s.toLowerCase().replace(/\n/g,"").includes(q)&&!t.toLowerCase().replace(/\n/g,"").includes(q))return"none";
    return null;
  });
  llblSel.style("display",l=>{
    if(l.value<minPct)return"none";
    const co=COMPANIES.find(c=>c.id===(l.target.id||l.target));
    if(activeSector!=="all"&&co&&!matchSector(co.sector))return"none";
    return null;
  });
  buildRanking();
}
