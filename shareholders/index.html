<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日経225 株主リレーションマップ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Sans', 'Meiryo', 'Yu Gothic', sans-serif;
  background: #0a0c14;
  color: #e0e0e0;
  overflow: hidden;
}

/* ── Header ── */
#header {
  position: absolute; top: 0; left: 0; right: 0; height: 56px;
  padding: 0 20px;
  background: rgba(10,12,20,0.96);
  border-bottom: 1px solid #1e2130;
  display: flex; align-items: center; gap: 20px;
  z-index: 30;
  backdrop-filter: blur(8px);
}
#header h1 { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; letter-spacing: 0.05em; }
#header .badge {
  font-size: 10px; padding: 2px 8px; border-radius: 10px;
  background: #1e2a4a; color: #60a5fa; border: 1px solid #2a3d6a;
  white-space: nowrap;
}

/* ── Filter buttons ── */
#filters {
  display: flex; gap: 6px; align-items: center; margin-left: 8px;
}
.filter-btn {
  padding: 4px 11px; border-radius: 14px; border: 1px solid #2a2d3a;
  font-size: 11px; cursor: pointer; background: transparent; color: #888;
  transition: all 0.15s; white-space: nowrap;
  font-family: inherit;
}
.filter-btn:hover { border-color: #4a5070; color: #ccc; }
.filter-btn.active { background: #1e2a4a; color: #7dd3fc; border-color: #3a5080; }
.filter-btn.all-btn.active { background: #1e3028; color: #6ee7b7; border-color: #2a5040; }

/* ── Legend ── */
#legend {
  display: flex; gap: 14px; margin-left: auto; align-items: center;
}
.leg { display: flex; align-items: center; gap: 5px; font-size: 10px; color: #777; white-space: nowrap; }
.leg-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

/* ── Canvas ── */
#canvas { position: absolute; top: 56px; left: 0; right: 280px; bottom: 0; }
svg { width: 100%; height: 100%; }

/* ── Side panel ── */
#side {
  position: absolute; top: 56px; right: 0; width: 280px; bottom: 0;
  background: rgba(12,14,22,0.97);
  border-left: 1px solid #1e2130;
  display: flex; flex-direction: column;
  z-index: 20;
}
#side-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid #1e2130;
}
#side-header .sh-title { font-size: 13px; font-weight: 600; color: #fff; }
#side-header .sh-sub { font-size: 10px; color: #555; margin-top: 2px; }

#side-content { flex: 1; overflow-y: auto; padding: 10px 0; }
#side-content::-webkit-scrollbar { width: 3px; }
#side-content::-webkit-scrollbar-thumb { background: #2a2d3a; border-radius: 2px; }

.sh-card {
  padding: 10px 14px;
  border-bottom: 1px solid #111318;
  cursor: pointer;
  transition: background 0.1s;
}
.sh-card:hover { background: #13161f; }
.sh-card.selected { background: #0d1525; border-left: 3px solid #3b82f6; padding-left: 11px; }
.sh-name { font-size: 11px; color: #ddd; font-weight: 500; }
.sh-meta { font-size: 10px; color: #555; margin-top: 2px; }
.sh-bars { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
.sh-bar-row { display: flex; align-items: center; gap: 6px; }
.sh-bar-label { font-size: 9px; color: #666; width: 80px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh-bar-track { flex: 1; height: 3px; background: #1a1d28; border-radius: 2px; }
.sh-bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
.sh-bar-pct { font-size: 9px; color: #7dd3fc; width: 34px; text-align: right; flex-shrink: 0; }

/* ── Tooltip ── */
#tooltip {
  position: absolute;
  background: rgba(15,17,28,0.97);
  border: 1px solid #2a3050;
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 11px;
  pointer-events: none;
  display: none;
  max-width: 220px;
  z-index: 50;
  box-shadow: 0 8px 30px rgba(0,0,0,0.6);
}
.tt-title { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 4px; }
.tt-type { font-size: 10px; margin-bottom: 8px; }
.tt-section { font-size: 10px; color: #555; margin: 6px 0 3px; text-transform: uppercase; letter-spacing: 0.06em; }
.tt-row { display: flex; justify-content: space-between; gap: 8px; margin: 2px 0; }
.tt-k { color: #777; }
.tt-v { color: #7dd3fc; font-weight: 600; }

/* ── Info bar bottom ── */
#infobar {
  position: absolute; bottom: 16px; left: 16px;
  background: rgba(12,14,22,0.85);
  border: 1px solid #1e2130;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 10px; color: #555;
  z-index: 20; line-height: 1.8;
  backdrop-filter: blur(4px);
}
#infobar span { color: #777; }

/* ── Node styles ── */
.node circle { cursor: pointer; }
.node text { pointer-events: none; font-size: 10px; fill: #ccc; text-anchor: middle; dominant-baseline: central; }
.node.company text { fill: #e0e0e0; font-weight: 600; font-size: 10.5px; }
.node.faded { opacity: 0.08; transition: opacity 0.2s; }
.node.highlighted circle { filter: drop-shadow(0 0 10px var(--glow)); }
.link.faded { opacity: 0.03; transition: opacity 0.2s; }
.link { transition: opacity 0.2s; }
</style>
</head>

const LINKS_RAW = [
  // 日本マスタートラスト
  { s: "日本マスタートラスト\n信託銀行", t: "トヨタ自動車",          v: 13.84 },
  { s: "日本マスタートラスト\n信託銀行", t: "ソニーグループ",          v: 18.50 },

  { s: "日本生命保険", t: "トヨタ自動車",          v: 4.85 },

  { s: "株式会社ティ・ティ\n（滝崎武光 資産管理会社）", t: "キーエンス", v: 53.12 },
  // 柳井正
  { s: "柳井正", t: "ファースト\nリテイリング", v: 16.19 },
  // 孫正義
  { s: "孫正義", t: "ソフトバンク\nグループ", v: 29.95 },

// ─────────────────────────────────────────
//  Color & size helpers
// ─────────────────────────────────────────
const TYPE_COLOR = {
  trust:      "#60a5fa",
  gov:        "#fb923c",
  corporate:  "#f59e0b",
  individual: "#34d399",
  foreign:    "#a78bfa",
  company:    "#f87171",
};
const SECTOR_COLOR = {
  "自動車":    "#ef4444",
  "電機":      "#f97316",
  "金融":      "#eab308",
  "通信・投資":"#22c55e",
  "精密機器":  "#06b6d4",
  "半導体":    "#8b5cf6",
  "ゲーム":    "#ec4899",
  "小売":      "#14b8a6",
};

// Compute shareholder node sizes by total holdings
function getShareholderSize(id) {
  const total = LINKS_RAW.filter(l => l.s === id).reduce((a, l) => a + l.v, 0);
  return Math.min(44, Math.max(14, Math.sqrt(total) * 3.5));
}

// Build nodes
const nodes = [
  ...SHAREHOLDERS.map(sh => ({
    ...sh, isCompany: false, type: sh.type,
    size: getShareholderSize(sh.id),
    holdCount: LINKS_RAW.filter(l => l.s === sh.id).length,
  })),
  ...COMPANIES.map(c => ({
    ...c, isCompany: true, type: "company",
  })),
];

const links = LINKS_RAW.map(l => ({ source: l.s, target: l.t, value: l.v }));

// ─────────────────────────────────────────
//  Build side panel
// ─────────────────────────────────────────
const maxHoldings = Math.max(...LINKS_RAW.map(l => l.v));

function buildSidePanel(filterSector = "all") {
  const container = document.getElementById("side-content");
  container.innerHTML = "";

  const relevantLinks = filterSector === "all" ? LINKS_RAW
    : LINKS_RAW.filter(l => {
      const co = COMPANIES.find(c => c.id === l.t);
      return co && co.sector === filterSector;
    });

  // Aggregate by shareholder
  const shMap = {};
  relevantLinks.forEach(l => {
    if (!shMap[l.s]) shMap[l.s] = [];
    shMap[l.s].push(l);
  });

  const sorted = Object.entries(shMap).sort((a, b) => b[1].length - a[1].length || b[1].reduce((x, l) => x + l.v, 0) - a[1].reduce((x, l) => x + l.v, 0));

  sorted.forEach(([shId, holdings]) => {
    const sh = SHAREHOLDERS.find(s => s.id === shId) || {};
    const card = document.createElement("div");
    card.className = "sh-card";
    card.dataset.shid = shId;

    const displayName = sh.short || shId.replace("\n", " ");
    const totalPct = holdings.reduce((a, l) => a + l.v, 0).toFixed(1);

    let barsHTML = "";
    holdings.sort((a, b) => b.v - a.v).slice(0, 5).forEach(l => {
      const co = COMPANIES.find(c => c.id === l.t);
      const color = co ? (SECTOR_COLOR[co.sector] || "#60a5fa") : "#60a5fa";
      const pct = (l.v / maxHoldings * 100).toFixed(1);
      const coName = l.t.replace("\n", " ");
      barsHTML += `<div class="sh-bar-row">
        <div class="sh-bar-label" title="${coName}">${coName}</div>
        <div class="sh-bar-track"><div class="sh-bar-fill" style="width:${pct}%;background:${color}"></div></div>
        <div class="sh-bar-pct">${l.v}%</div>
      </div>`;
    });

    const typeLabel = { trust:"信託・機関", gov:"政府系", corporate:"事業会社", individual:"個人", foreign:"外国機関" }[sh.type] || "";
    const dotColor = TYPE_COLOR[sh.type] || "#888";

    card.innerHTML = `
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
        <div style="width:7px;height:7px;border-radius:50%;background:${dotColor};flex-shrink:0"></div>
        <div class="sh-name">${displayName}</div>
      </div>
      <div class="sh-meta">${typeLabel} ／ ${holdings.length}社保有 ／ 合計${totalPct}%</div>
      <div class="sh-bars">${barsHTML}</div>`;

    card.addEventListener("click", () => highlightShareholder(shId, card));
    container.appendChild(card);
  });
}

// ─────────────────────────────────────────
//  D3 Graph
// ─────────────────────────────────────────
const canvasEl = document.getElementById("canvas");
const W = canvasEl.clientWidth;
const H = canvasEl.clientHeight;

const svg = d3.select("#graph").attr("viewBox", [0, 0, W, H]);
const g = svg.append("g");

// Arrow markers
const defs = svg.append("defs");
["arrow-hi", "arrow-lo", "arrow-gov"].forEach((id, i) => {
  const colors = ["#60a5fa", "#3a3d50", "#fb923c"];
  defs.append("marker").attr("id", id)
    .attr("viewBox","0 -4 8 8").attr("refX", 28).attr("refY", 0)
    .attr("markerWidth", 5).attr("markerHeight", 5).attr("orient","auto")
    .append("path").attr("d","M0,-4L8,0L0,4").attr("fill", colors[i]);
});

const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id)
    .distance(d => {
      const v = d.value;
      if (v >= 30) return 100;
      if (v >= 10) return 150;
      return 200;
    })
    .strength(d => d.value > 10 ? 0.8 : 0.4))
  .force("charge", d3.forceManyBody().strength(d => d.isCompany ? -800 : -400))
  .force("center", d3.forceCenter(W / 2, H / 2))
  .force("collision", d3.forceCollide().radius(d => (d.size || 24) + 22));

// Links
const linkSel = g.append("g").selectAll("line")
  .data(links).join("line")
  .attr("class", "link")
  .attr("stroke", d => {
    const sh = SHAREHOLDERS.find(s => s.id === (d.source.id || d.source));
    if (sh?.type === "gov") return "#fb923c";
    return d.value >= 10 ? "#3b82f6" : d.value >= 5 ? "#2a3a5a" : "#1e2535";
  })
  .attr("stroke-width", d => Math.max(0.7, Math.sqrt(d.value) * 0.85))
  .attr("stroke-opacity", d => d.value >= 10 ? 0.7 : 0.45)
  .attr("marker-end", d => {
    const sh = SHAREHOLDERS.find(s => s.id === (d.source.id || d.source));
    if (sh?.type === "gov") return "url(#arrow-gov)";
    return d.value >= 8 ? "url(#arrow-hi)" : "url(#arrow-lo)";
  });

// Link % labels (only for large holdings)
const linkLabelSel = g.append("g").selectAll("text")
  .data(links.filter(l => l.value >= 8)).join("text")
  .attr("text-anchor", "middle").attr("font-size", 8.5)
  .attr("fill", "#4a5a7a").text(d => d.value + "%");

// Nodes
const nodeSel = g.append("g").selectAll("g")
  .data(nodes).join("g")
  .attr("class", d => "node" + (d.isCompany ? " company" : ""))
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag",  (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end",   (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

nodeSel.append("circle")
  .attr("r", d => d.size || 24)
  .attr("fill", d => {
    const c = TYPE_COLOR[d.type] || "#888";
    return d.isCompany ? c + "20" : c + "1a";
  })
  .attr("stroke", d => {
    if (d.isCompany) return SECTOR_COLOR[d.sector] || TYPE_COLOR[d.type];
    return TYPE_COLOR[d.type] || "#888";
  })
  .attr("stroke-width", d => d.isCompany ? 2.5 : 1.5)
  .style("--glow", d => TYPE_COLOR[d.type] || "#888");

// Labels (multiline)
nodeSel.each(function(d) {
  const el = d3.select(this);
  const lines = d.id.split("\n");
  const lh = 12;
  const totalH = (lines.length - 1) * lh;
  lines.forEach((line, i) => {
    el.append("text")
      .attr("y", -totalH / 2 + i * lh)
      .text(line);
  });
});

// ─────────────────────────────────────────
//  Tooltip
// ─────────────────────────────────────────
const tooltip = document.getElementById("tooltip");

nodeSel
  .on("mouseover", (event, d) => {
    const name = (d.short || d.id).replace(/\n/g, " ");
    let html = `<div class="tt-title">${name}</div>`;
    if (d.isCompany) {
      html += `<div class="tt-type" style="color:${SECTOR_COLOR[d.sector]||'#888'}">${d.sector} ／ ${d.code}</div>`;
      if (d.desc) html += `<div style="color:#666;font-size:10px;margin-bottom:6px">${d.desc}</div>`;
      const inv = links.filter(l => (l.target.id || l.target) === d.id);
      if (inv.length) {
        html += `<div class="tt-section">主要株主</div>`;
        inv.sort((a,b) => b.value - a.value).forEach(l => {
          const sn = ((l.source.id || l.source)).replace(/\n/g," ");
          html += `<div class="tt-row"><span class="tt-k">${sn}</span><span class="tt-v">${l.value}%</span></div>`;
        });
      }
    } else {
      const typeLabel = { trust:"信託・機関投資家", gov:"政府系株主", corporate:"事業会社株主", individual:"個人株主（創業家）", foreign:"外国機関投資家" }[d.type] || "";
      html += `<div class="tt-type" style="color:${TYPE_COLOR[d.type]}">${typeLabel}</div>`;
      if (d.desc) html += `<div style="color:#666;font-size:10px;margin-bottom:6px">${d.desc}</div>`;
      const hld = links.filter(l => (l.source.id || l.source) === d.id);
      if (hld.length) {
        html += `<div class="tt-section">保有銘柄</div>`;
        hld.sort((a,b) => b.value - a.value).forEach(l => {
          const tn = ((l.target.id || l.target)).replace(/\n/g," ");
          html += `<div class="tt-row"><span class="tt-k">${tn}</span><span class="tt-v">${l.value}%</span></div>`;
        });
      }
    }
    tooltip.innerHTML = html;
    tooltip.style.display = "block";
  })
  .on("mousemove", event => {
    const x = event.clientX + 16, y = event.clientY - 10;
    tooltip.style.left = Math.min(x, window.innerWidth - 240) + "px";
    tooltip.style.top  = Math.max(y, 10) + "px";
  })
  .on("mouseout", () => { tooltip.style.display = "none"; })
  .on("click", (event, d) => {
    event.stopPropagation();
    if (d.isCompany) {
      highlightCompany(d.id);
    } else {
      highlightShareholder(d.id);
    }
  });

svg.on("click", resetHighlight);

// ─────────────────────────────────────────
//  Highlight logic
// ─────────────────────────────────────────
let activeFilter = "all";

function highlightShareholder(shId, cardEl) {
  const connected = new Set([shId]);
  links.forEach(l => {
    const s = l.source.id || l.source;
    const t = l.target.id || l.target;
    if (s === shId) connected.add(t);
  });
  applyHighlight(connected);
  document.querySelectorAll(".sh-card").forEach(c => c.classList.remove("selected"));
  if (cardEl) cardEl.classList.add("selected");
  else {
    document.querySelectorAll(".sh-card").forEach(c => {
      if (c.dataset.shid === shId) c.classList.add("selected");
    });
  }
}

function highlightCompany(coId) {
  const connected = new Set([coId]);
  links.forEach(l => {
    const s = l.source.id || l.source;
    const t = l.target.id || l.target;
    if (t === coId) connected.add(s);
  });
  applyHighlight(connected);
}

function applyHighlight(connected) {
  nodeSel.classed("highlighted", d => connected.has(d.id));
  nodeSel.classed("faded", d => !connected.has(d.id));
  linkSel.classed("faded", l => {
    const s = l.source.id || l.source;
    const t = l.target.id || l.target;
    return !connected.has(s) || !connected.has(t);
  });
}

function resetHighlight() {
  nodeSel.classed("highlighted faded", false);
  linkSel.classed("faded", false);
  document.querySelectorAll(".sh-card").forEach(c => c.classList.remove("selected"));
}

// ─────────────────────────────────────────
//  Sector filter
// ─────────────────────────────────────────
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.filter;
    resetHighlight();

    if (activeFilter === "all") {
      nodeSel.style("display", null);
      linkSel.style("display", null);
      linkLabelSel.style("display", null);
    } else {
      const visibleCompanies = COMPANIES.filter(c => c.sector === activeFilter).map(c => c.id);
      const visibleShareholders = new Set();
      links.forEach(l => {
        const t = l.target.id || l.target;
        if (visibleCompanies.includes(t)) visibleShareholders.add(l.source.id || l.source);
      });
      const visible = new Set([...visibleCompanies, ...visibleShareholders]);
      nodeSel.style("display", d => visible.has(d.id) ? null : "none");
      linkSel.style("display", l => {
        const t = l.target.id || l.target;
        return visibleCompanies.includes(t) ? null : "none";
      });
      linkLabelSel.style("display", l => {
        const t = l.target.id || l.target;
        return visibleCompanies.includes(t) ? null : "none";
      });
    }
    buildSidePanel(activeFilter);
  });
});

// ─────────────────────────────────────────
//  Zoom
// ─────────────────────────────────────────
const zoom = d3.zoom().scaleExtent([0.25, 3])
  .on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom);

// ─────────────────────────────────────────
//  Tick
// ─────────────────────────────────────────
simulation.on("tick", () => {
  linkSel
    .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  linkLabelSel
    .attr("x", d => (d.source.x + d.target.x) / 2)
    .attr("y", d => (d.source.y + d.target.y) / 2 - 3);
  nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
});

// ─────────────────────────────────────────
//  Init
// ─────────────────────────────────────────
buildSidePanel("all");
</script>
</body>
</html>
