  ...CO.map(c=>({id:c.id,s:c.s,code:c.c,desc:c.d,isC:true,type:"company",size:20})),
];
const links=LR.map(([s,t,v])=>({source:s,target:t,value:v}));

// ── State ──
let AS="all",MP=0,SQ="",AT="r";

function ms(sec){
  if(AS==="all")return true;
  if(AS==="その他")return!["自動車","自動車部品","電機・IT","精密機器","半導体","化学","素材","金融","通信","通信・投資","ゲーム","小売","製薬","商社","不動産","建設","インフラ","交通","食品","食品・飲料"].includes(sec);
  return sec===AS||sec.startsWith(AS);
}

// ── Side panel ──
function buildR(){
  const el=document.getElementById("rp");el.innerHTML="";
  const mxV=Math.max(...LR.map(l=>l[2]));
  const fd=SH
    .map(sh=>({sh,ls:LR.filter(l=>l[0]===sh.id&&l[2]>=MP&&(AS==="all"||CO.find(c=>c.id===l[1]&&ms(c.s))))}))
    .filter(x=>x.ls.length>0)
    .sort((a,b)=>b.ls.length-a.ls.length||b.ls.reduce((s,l)=>s+l[2],0)-a.ls.reduce((s,l)=>s+l[2],0));
  fd.forEach(({sh,ls})=>{
    const card=document.createElement("div");card.className="shc";card.dataset.id=sh.id;
    const tot=ls.reduce((s,l)=>s+l[2],0).toFixed(1),col=TC[sh.type]||"#888";
    const bars=ls.sort((a,b)=>b[2]-a[2]).slice(0,4).map(l=>{
      const co=CO.find(c=>c.id===l[1]);const cc=co?SC[co.s]||"#60a5fa":"#60a5fa";
      return`<div class="sbrr"><div class="sbrl" title="${l[1].replace('\n',' ')}">${l[1].replace('\n',' ')}</div><div class="sbrt"><div class="sbrf" style="width:${Math.min(100,l[2]/mxV*100).toFixed(1)}%;background:${cc}"></div></div><div class="sbrp">${l[2]}%</div></div>`;
    }).join('');
    const tl={trust:"信託",gov:"政府系",govorg:"政府機関",corporate:"事業会社",individual:"個人",foreign:"外国機関",institution:"保険"}[sh.type]||"";
    card.innerHTML=`<div class="shn"><div class="shd" style="background:${col}"></div>${sh.id.replace('\n',' ')}</div><div class="shm">${tl} / ${ls.length}社 / 計${tot}%</div><div class="sbr">${bars}</div>`;
    card.addEventListener("click",()=>hlNode(sh.id,card));
    el.appendChild(card);
  });
}

function showCross(nid){
  document.querySelectorAll(".st").forEach(t=>t.classList.remove("a"));
  document.querySelector('[data-t="c"]').classList.add("a");
  AT="c";
  document.getElementById("rp").style.display="none";
  const cp=document.getElementById("cp");cp.style.display="block";
  const sh=SH.find(s=>s.id===nid),co=CO.find(c=>c.id===nid);
  cp.innerHTML="";
  if(sh){
    const ls=LR.filter(l=>l[0]===nid).sort((a,b)=>b[2]-a[2]);
    cp.innerHTML=`<div class="ct">${nid.replace('\n',' ')}</div><div class="cs">${{trust:"信託・機関投資家",gov:"政府系株主",govorg:"政府系機関",corporate:"事業会社株主",individual:"個人（創業家）",foreign:"外国機関投資家",institution:"保険会社"}[sh.type]||""} / ${ls.length}社保有</div>${ls.map(l=>`<div class="cr"><span class="crn">${l[1].replace('\n',' ')}</span><span class="crv">${l[2]}%</span></div>`).join('')}`;
  }else if(co){
    const ls=LR.filter(l=>l[1]===nid).sort((a,b)=>b[2]-a[2]);
    cp.innerHTML=`<div class="ct">${nid.replace('\n',' ')}</div><div class="cs">${co.s} / ${co.code} / 株主${ls.length}社</div>${ls.map(l=>`<div class="cr"><span class="crn">${l[0].replace('\n',' ')}</span><span class="crv">${l[2]}%</span></div>`).join('')}`;
  }
}

// ── D3 ──
const area=document.getElementById("ga");
const W=area.clientWidth,H=area.clientHeight;
const svg=d3.select("#graph").attr("viewBox",[0,0,W,H]);
const g=svg.append("g");
const zoom=d3.zoom().scaleExtent([0.15,5]).on("zoom",e=>g.attr("transform",e.transform));
svg.call(zoom);

// Markers
const defs=svg.append("defs");
[["ah","#3b82f6",24],["al","#1e2840",24],["ag","#fb923c",28],["agr","#34d399",24],["ai","#f59e0b",24],["ar","#6366f1",28],["agg","#f97316",26],["asb","#22c55e",30]].forEach(([id,c,r])=>{
  defs.append("marker").attr("id",id).attr("viewBox","0 -4 8 8").attr("refX",r).attr("refY",0).attr("markerWidth",5).attr("markerHeight",5).attr("orient","auto").append("path").attr("d","M0,-4L8,0L0,4").attr("fill",c);
});

const sim=d3.forceSimulation(nodes)
  .force("link",d3.forceLink(links).id(d=>d.id)
    .distance(d=>{if(d.value>=40)return 80;if(d.value>=20)return 120;if(d.value>=10)return 155;if(d.value>=5)return 185;return 220;})
    .strength(d=>d.value>20?0.95:d.value>10?0.7:d.value>5?0.45:0.2))
  .force("charge",d3.forceManyBody().strength(d=>d.isC?-300:-180))
  .force("center",d3.forceCenter(W/2,H/2))
  .force("collision",d3.forceCollide().radius(d=>(d.size||16)+14));

function mrkr(l){
  const sh=SH.find(s=>s.id===(l.source.id||l.source));
  if(!sh)return"url(#al)";
  if(sh.id==="ロシュ")return"url(#ar)";
  if(sh.id==="原子力損害賠償・廃炉等支援機構")return"url(#agg)";
  if(sh.type==="gov"||sh.type==="govorg")return"url(#ag)";
  if(sh.type==="individual")return"url(#agr)";
  if(sh.id==="バークシャー・ハサウェイ")return"url(#ai)";
  if(sh.id==="ソフトバンクグループ（SB株主）")return"url(#asb)";
  return l.value>=10?"url(#ah)":"url(#al)";
}
function lclr(l){
  const sh=SH.find(s=>s.id===(l.source.id||l.source));
  if(!sh)return"#1a2240";
  if(sh.id==="ロシュ")return"#6366f1";
  if(sh.id==="原子力損害賠償・廃炉等支援機構")return"#f97316";
  if(sh.type==="gov")return"#fb923c";
  if(sh.type==="individual")return"#34d399";
  if(sh.id==="バークシャー・ハサウェイ")return"#f59e0b";
  if(sh.id==="ソフトバンクグループ（SB株主）")return"#22c55e";
  return l.value>=15?"#3b82f6":l.value>=8?"#1e3060":"#111828";
}

const lkSel=g.append("g").selectAll("line").data(links).join("line")
  .attr("class","link")
  .attr("stroke",lclr)
  .attr("stroke-width",d=>Math.max(0.4,Math.sqrt(d.value)*0.75))
  .attr("stroke-opacity",d=>d.value>=20?0.85:d.value>=10?0.65:d.value>=5?0.40:0.25)
  .attr("marker-end",mrkr);

const llSel=g.append("g").selectAll("text").data(links.filter(l=>l.value>=15)).join("text")
  .attr("text-anchor","middle").attr("font-size",7).attr("fill","#3a5070").text(d=>d.value+"%");

const ndSel=g.append("g").selectAll("g").data(nodes).join("g")
  .attr("class",d=>"node"+(d.isC?" company":""))
  .style("--glow",d=>d.isC?(SC[d.s]||"#f87171"):(TC[d.type]||"#60a5fa"))
  .call(d3.drag()
    .on("start",(e,d)=>{if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y})
    .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y})
    .on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));

ndSel.append("circle")
  .attr("r",d=>d.size)
  .attr("fill",d=>{const c=d.isC?(SC[d.s]||"#f87171"):(TC[d.type]||"#888");return c+(d.isC?"18":"14");})
  .attr("stroke",d=>d.isC?(SC[d.s]||"#f87171"):(TC[d.type]||"#888"))
  .attr("stroke-width",d=>d.isC?1.8:1.4);

ndSel.each(function(d){
  const el=d3.select(this),ls=d.id.split("\n"),lh=10,th=(ls.length-1)*lh;
  ls.forEach((line,i)=>el.append("text").attr("y",-th/2+i*lh).text(line));
});

// Tooltip
const ttEl=document.getElementById("tt");
ndSel
  .on("mouseover",(ev,d)=>{
    const nm=(d.id||"").replace(/\n/g," ");let html=`<div class="tt1">${nm}</div>`;
    if(d.isC){
      html+=`<div class="tt2" style="color:${SC[d.s]||'#888'}">${d.s} / ${d.code}</div>`;
      if(d.desc)html+=`<div style="color:#3a5070;font-size:8.5px;margin-bottom:5px">${d.desc}</div>`;
      const inv=LR.filter(l=>l[1]===d.id).sort((a,b)=>b[2]-a[2]);
      if(inv.length){html+=`<div class="tts">主要株主</div>`;inv.forEach(l=>{html+=`<div class="ttr"><span class="ttk">${l[0].replace('\n',' ')}</span><span class="ttv">${l[2]}%</span></div>`;});}
    }else{
      const tl={trust:"信託・機関投資家",gov:"政府系株主",govorg:"政府系機関",corporate:"事業会社株主",individual:"個人（創業家）",foreign:"外国機関投資家",institution:"保険会社"}[d.type]||"";
      html+=`<div class="tt2" style="color:${TC[d.type]}">${tl}</div>`;
      if(d.desc)html+=`<div style="color:#3a5070;font-size:8.5px;margin-bottom:5px">${d.desc}</div>`;
      const ls=LR.filter(l=>l[0]===d.id).sort((a,b)=>b[2]-a[2]);
      if(ls.length){html+=`<div class="tts">保有銘柄</div>`;ls.forEach(l=>{html+=`<div class="ttr"><span class="ttk">${l[1].replace('\n',' ')}</span><span class="ttv">${l[2]}%</span></div>`;});}
    }
    ttEl.innerHTML=html;ttEl.style.display="block";
  })
  .on("mousemove",ev=>{ttEl.style.left=Math.min(ev.clientX+12,window.innerWidth-220)+"px";ttEl.style.top=Math.max(ev.clientY-8,8)+"px";})
  .on("mouseout",()=>ttEl.style.display="none")
  .on("click",(ev,d)=>{ev.stopPropagation();hlNode(d.id);showCross(d.id);});

svg.on("click",reset);

function hlNode(id,card){
  const conn=new Set([id]);
  links.forEach(l=>{const s=l.source.id||l.source,t=l.target.id||l.target;if(s===id)conn.add(t);if(t===id)conn.add(s);});
  ndSel.classed("hl",d=>conn.has(d.id)).classed("faded",d=>!conn.has(d.id));
  lkSel.classed("faded",l=>!conn.has(l.source.id||l.source)||!conn.has(l.target.id||l.target));
  document.querySelectorAll(".shc").forEach(c=>c.classList.remove("sel"));
  if(card)card.classList.add("sel");
  else document.querySelectorAll(".shc").forEach(c=>{if(c.dataset.id===id)c.classList.add("sel");});
}
function reset(){ndSel.classed("hl faded",false);lkSel.classed("faded",false);document.querySelectorAll(".shc").forEach(c=>c.classList.remove("sel"));}

sim.on("tick",()=>{
  lkSel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  llSel.attr("x",d=>(d.source.x+d.target.x)/2).attr("y",d=>(d.source.y+d.target.y)/2-3);
  ndSel.attr("transform",d=>`translate(${d.x},${d.y})`);
});

// ── Filters ──
function applyF(){
  const q=SQ.toLowerCase();
  ndSel.style("display",d=>{
    if(q&&!d.id.toLowerCase().replace(/\n/g,"").includes(q))return"none";
    if(!d.isC)return null;
    if(AS!=="all"&&!ms(d.s))return"none";
    return null;
  });
  lkSel.style("display",l=>{
    const s=l.source.id||l.source,t=l.target.id||l.target;
    if(l.value<MP)return"none";
    const co=CO.find(c=>c.id===t);
    if(AS!=="all"&&co&&!ms(co.s))return"none";
    if(q&&!s.toLowerCase().replace(/\n/g,"").includes(q)&&!t.toLowerCase().replace(/\n/g,"").includes(q))return"none";
    return null;
  });
  llSel.style("display",l=>{
    if(l.value<MP||l.value<15)return"none";
    const co=CO.find(c=>c.id===(l.target.id||l.target));
    if(AS!=="all"&&co&&!ms(co.s))return"none";
    return null;
  });
  buildR();
}

document.querySelectorAll(".btn[data-s]").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".btn[data-s]").forEach(x=>x.classList.remove("a","ag"));
  b.classList.add(b.dataset.s==="all"?"ag":"a");
  AS=b.dataset.s;reset();applyF();
}));
document.querySelectorAll(".btn[data-m]").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".btn[data-m]").forEach(x=>x.classList.remove("a"));
  b.classList.add("a");MP=+b.dataset.m;reset();applyF();
}));
document.getElementById("srch").addEventListener("input",e=>{SQ=e.target.value;reset();applyF();});

document.querySelectorAll(".st").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".st").forEach(x=>x.classList.remove("a"));t.classList.add("a");
  AT=t.dataset.t;
  document.getElementById("rp").style.display=AT==="r"?"block":"none";
  document.getElementById("cp").style.display=AT==="c"?"block":"none";
}));

document.querySelectorAll(".ic[data-h]").forEach(ch=>ch.addEventListener("click",()=>{
  const id=ch.dataset.h;hlNode(id);showCross(id);
}));

buildR();
</script>
</body>
</html>
