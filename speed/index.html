  header { background:linear-gradient(135deg,#0d1b3e,#162447); padding:10px 18px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #1e3a5f; flex-shrink:0; }

  .logo-area a { color:#64b5f6; text-decoration:none; font-size:13px; opacity:.8; }

  header h1 { font-size:17px; font-weight:700; color:#fff; }
  header h1 span { color:#ff6b6b; }
  .header-right { font-size:11px; color:#90a4ae; }
  .source-badge { background:rgba(100,181,246,.12); border:1px solid #1e6fa8; border-radius:20px; padding:4px 12px; font-size:11px; color:#64b5f6; }

  /* ── コントロールバー ── */
  #control-bar { background:#0f1e3a; border-bottom:1px solid #1e3a5f; padding:8px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; flex-shrink:0; }
  .ctrl-label { font-size:11px; color:#78909c; margin-right:2px; }
  .filter-btn { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:#b0bec5; border-radius:16px; padding:4px 12px; font-size:11px; cursor:pointer; transition:.2s; white-space:nowrap; }
  .filter-btn:hover { background:rgba(255,255,255,.12); }
  .filter-btn.active { background:#1565c0; border-color:#1976d2; color:#fff; }
  .filter-btn.orbis-btn.active { background:#b71c1c; border-color:#c62828; }
  .filter-btn.type-zone.active { background:#f57f17; border-color:#fb8c00; color:#fff; }
  .type-toggle { display:flex; gap:6px; align-items:center; padding-left:10px; border-left:1px solid #1e3a5f; }

  /* ── 統計バー ── */
  #stats-bar { padding:6px 14px; background:#080d1c; border-bottom:1px solid #1e3a5f; display:flex; gap:16px; flex-shrink:0; flex-wrap:wrap; align-items:center; }
  .stat-chip { font-size:11px; }
  .stat-chip .num { font-weight:700; font-size:15px; }
  .red   { color:#ef5350; }
  .orange{ color:#ff8f00; }
  .yellow{ color:#fdd835; }
  .blue  { color:#42a5f5; }

  /* ── マップ本体 ── */
  #map { flex:1; z-index:1; }

  /* ── ポップアップ カスタム ── */
  .leaflet-popup-content-wrapper { background:#0d1b3e; border:1px solid #1e6fa8; border-radius:10px; color:#e0e8f0; box-shadow:0 4px 20px rgba(0,0,0,.6); }
  .leaflet-popup-tip { background:#0d1b3e; }
  .popup-inner { min-width:200px; }
  .popup-type { font-size:10px; border-radius:4px; padding:2px 8px; margin-bottom:6px; display:inline-block; font-weight:700; }
  .popup-type.orbis  { background:#b71c1c; color:#fff; }
  .popup-type.patrol { background:#e65100; color:#fff; }
  .popup-type.zone   { background:#f57f17; color:#fff; }
  .popup-title { font-size:14px; font-weight:700; margin-bottom:4px; }
  .popup-road { font-size:12px; color:#64b5f6; margin-bottom:4px; }
  .popup-area { font-size:11px; color:#78909c; }
  .popup-note { font-size:11px; color:#ffb300; margin-top:5px; background:rgba(255,179,0,.1); padding:4px 8px; border-radius:4px; }

  /* ── 凡例 ── */
  #legend { position:absolute; bottom:28px; left:12px; z-index:900; background:rgba(10,15,30,.92); border:1px solid #1e3a5f; border-radius:10px; padding:10px 14px; font-size:11px; backdrop-filter:blur(6px); }
  #legend h4 { font-size:11px; color:#90a4ae; margin-bottom:8px; font-weight:600; }
  .leg-item { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
  .leg-dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; border:2px solid #fff; }
  .leg-dot.orbis  { background:#ef5350; }
  .leg-dot.patrol { background:#ff8f00; }
  .leg-dot.zone   { background:#fdd835; }

  /* ── フッター ── */
  #footer-note { position:absolute; bottom:6px; right:12px; z-index:900; font-size:10px; color:#455a64; }

  { type:"zone", area:"横浜市",      lat:35.455, lng:139.637, name:"みなとみらい・山下町周辺",         road:"市道・港湾道路",         note:"都市型速度違反多発エリア（根岸町・山下町）" },
];

// ═══════════════════════════════════════════════
//  マップ初期化
// ═══════════════════════════════════════════════
const map = L.map('map', {
  center: [35.44, 139.36],
  zoom: 10,
  zoomControl: false,
});
L.control.zoom({ position:'bottomright' }).addTo(map);

// ダーク背景タイル
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
  maxZoom: 19,
  subdomains: 'abcd',
}).addTo(map);

// ─── カスタムアイコン ─────────────────────────────────────
function makeIcon(type) {
  const cfg = {
    orbis:  { color:'#ef5350', glow:'rgba(239,83,80,.6)',  size:18, border:'#fff' },
    patrol: { color:'#ff8f00', glow:'rgba(255,143,0,.5)', size:13, border:'#fff' },
    zone:   { color:'#fdd835', glow:'rgba(253,216,53,.5)', size:13, border:'rgba(255,255,255,.6)' },
  }[type];
  return L.divIcon({
    className:'',
    html:`<div style="
      width:${cfg.size}px;height:${cfg.size}px;border-radius:50%;
      background:${cfg.color};
      border:2px solid ${cfg.border};
      box-shadow:0 0 10px ${cfg.glow}, 0 0 3px rgba(0,0,0,.8);
      cursor:pointer;
    "></div>`,
    iconSize:[cfg.size, cfg.size],
    iconAnchor:[cfg.size/2, cfg.size/2],
    popupAnchor:[0, -cfg.size/2-4],
  });
}

const typeLabel = {
  orbis:  '🚨 固定オービス',
  patrol: '🚔 取締実施場所',
  zone:   '⚠️ 注意区間',
};

// ─── マーカー生成 ──────────────────────────────────────────
const markers = DATA.map(d => {
  const m = L.marker([d.lat, d.lng], { icon: makeIcon(d.type) });
  const noteHtml = d.note ? `<div class="popup-note">ℹ ${d.note}</div>` : '';
  m.bindPopup(`
    <div class="popup-inner">
      <span class="popup-type ${d.type}">${typeLabel[d.type]}</span>
      <div class="popup-title">${d.name}</div>
      <div class="popup-road">🛣 ${d.road}</div>
      <div class="popup-area">📍 ${d.area}</div>
      ${noteHtml}
    </div>
  `, { maxWidth:290 });
  m.addTo(map);
  m._data = d;
  return m;
});

// ═══════════════════════════════════════════════
//  フィルタリング処理
// ═══════════════════════════════════════════════
let activeArea = 'all';
const activeTypes = new Set(['orbis','patrol','zone']);

function applyFilter() {
  const shown = { orbis:0, patrol:0, zone:0 };
  markers.forEach(m => {
    const d = m._data;
    const areaOk = activeArea === 'all' || d.area === activeArea;
    const typeOk = activeTypes.has(d.type);
    if (areaOk && typeOk) { m.addTo(map); shown[d.type]++; }
    else { map.removeLayer(m); }
  });
  document.getElementById('cnt-orbis').textContent  = shown.orbis;
  document.getElementById('cnt-patrol').textContent = shown.patrol;
  document.getElementById('cnt-zone').textContent   = shown.zone;
}

// エリアボタン
document.querySelectorAll('.filter-btn[data-area]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-area]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeArea = btn.dataset.area;
    applyFilter();
  });
});

// 種別ボタン
document.querySelectorAll('.filter-btn[data-type]').forEach(btn => {
  btn.addEventListener('click', () => {
    const t = btn.dataset.type;
    if (activeTypes.has(t)) {
      activeTypes.delete(t);
      btn.classList.remove('active');
    } else {
      activeTypes.add(t);
      btn.classList.add('active');
    }
    applyFilter();
  });
});
</script>
</body>
</html>
